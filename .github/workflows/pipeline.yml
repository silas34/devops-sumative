name: ci-cd-opentofu-s3

on:
  push:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index exists
        run: test -f app/index.html

  deploy:
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install OpenTofu
        run: |
          curl -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh
          chmod +x install-opentofu.sh
          ./install-opentofu.sh --install-method standalone
          tofu --version

      - name: OpenTofu init/fmt/validate/plan
        working-directory: iac
        run: |
          tofu init
          tofu fmt -check
          tofu validate
          tofu plan \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "bucket_name=${{ vars.BUCKET_NAME }}"

      - name: OpenTofu apply
        working-directory: iac
        run: |
          tofu apply -auto-approve \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "bucket_name=${{ vars.BUCKET_NAME }}"

      - name: Deploy website files to S3
        run: |
          aws s3 sync app "s3://${{ vars.BUCKET_NAME }}" --delete